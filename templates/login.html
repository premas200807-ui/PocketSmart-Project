{% extends "base.html" %}
{% block title %}Sign In - PocketSmart AI{% endblock %}
{% block content %}
<main class="auth-page">
  <div class="auth-logo">
    <h1>PocketSmart</h1>
    <p>AI-Powered Budget Planning</p>
  </div>
  <div class="auth-card">
    <h2>Welcome Back</h2>
    <div id="alert" class="alert"></div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-icon"><i class="fa-solid fa-user"></i>
          <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username"></div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-icon"><i class="fa-solid fa-lock"></i>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password"></div>
      </div>
      <button type="submit" class="btn btn-block" id="loginBtn">Sign In <i class="fa-solid fa-right-to-bracket"></i></button>
    </form>
    <p class="switch">Don't have an account? <a href="/register"><strong>Create one</strong></a></p>
  </div>
</main>
{% endblock %}
{% block scripts %}
<script>
  const alertEl = document.getElementById("alert");
  if (new URLSearchParams(location.search).get("registered")) {
    showAlert(alertEl, "Account created! Please sign in.", "success");
  }
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    if (!username || !password) return showAlert(alertEl, "Please enter username and password.");
    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    try {
      await api("/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ username, password }),
      });
      window.location.href = "/dashboard";
    } catch (err) {
      showAlert(alertEl, err.message);
      btn.disabled = false;
    }
  });
</script>
{% endblock %}
